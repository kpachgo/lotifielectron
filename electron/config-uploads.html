<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Configurar ruta de guardado</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --border: #d1d5db;
      --primary: #0a4ecb;
      --ok: #166534;
      --warn: #92400e;
      --error: #b91c1c;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .wrap {
      padding: 16px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 18px;
    }

    .help {
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 13px;
    }

    label {
      display: block;
      font-size: 13px;
      margin-bottom: 6px;
      color: #374151;
    }

    input[type="text"] {
      width: 100%;
      box-sizing: border-box;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 10px;
      font-size: 14px;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(10, 78, 203, 0.15);
    }

    .meta {
      margin-top: 8px;
      font-size: 12px;
      color: var(--muted);
      word-break: break-all;
    }

    .status {
      margin-top: 10px;
      min-height: 20px;
      font-size: 13px;
      word-break: break-word;
    }

    .status.ok { color: var(--ok); }
    .status.warn { color: var(--warn); }
    .status.error { color: var(--error); }

    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 14px;
    }

    button {
      border: 1px solid var(--border);
      background: #fff;
      color: #111827;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 13px;
      cursor: pointer;
    }

    button.primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Configurar ruta de guardado</h1>
      <p class="help">
        Ingresa una ruta local o UNC. Ejemplo: \\Desktop-ssf4s0r\laptopg\LOTIFI_SHARED_UPLOADS_DIR
      </p>

      <label for="rutaInput">Ruta compartida de comprobantes</label>
      <input id="rutaInput" type="text" autocomplete="off" spellcheck="false">

      <div id="metaActual" class="meta"></div>
      <div id="status" class="status"></div>

      <div class="actions">
        <button id="btnCancelar" type="button">Cancelar</button>
        <button id="btnValidar" type="button">Validar</button>
        <button id="btnGuardar" class="primary" type="button">Guardar</button>
      </div>
    </div>
  </div>

  <script>
    const rutaInput = document.getElementById('rutaInput');
    const metaActual = document.getElementById('metaActual');
    const statusEl = document.getElementById('status');
    const btnCancelar = document.getElementById('btnCancelar');
    const btnValidar = document.getElementById('btnValidar');
    const btnGuardar = document.getElementById('btnGuardar');

    function setStatus(tipo, texto) {
      statusEl.className = `status ${tipo || ''}`.trim();
      statusEl.textContent = texto || '';
    }

    function setLoading(on) {
      btnValidar.disabled = on;
      btnGuardar.disabled = on;
      btnCancelar.disabled = on;
    }

    async function cargarDatos() {
      try {
        const data = await window.uploadsConfig.get();
        const inicial = data.savedSharedUploadsDir || data.defaultSharedUploadsDir || '';
        rutaInput.value = inicial;

        const modo = data.effectiveMode || 'desconocido';
        const rutaActiva = data.effectiveUploadsDir || '(sin ruta activa)';
        metaActual.textContent = `Ruta activa: ${rutaActiva} | Modo: ${modo}`;
      } catch (error) {
        setStatus('error', `No se pudo cargar configuracion: ${error.message}`);
      }
    }

    async function validarRuta() {
      const ruta = rutaInput.value.trim();
      if (!ruta) {
        setStatus('warn', 'Ingresa una ruta antes de validar.');
        return false;
      }

      setLoading(true);
      setStatus('warn', 'Validando ruta...');
      try {
        const res = await window.uploadsConfig.validate(ruta);
        if (!res.ok) {
          setStatus('error', `Ruta invalida: ${res.message || 'Error de acceso.'}`);
          return false;
        }
        rutaInput.value = res.normalizedPath || ruta;
        setStatus('ok', `Ruta valida: ${rutaInput.value}`);
        return true;
      } catch (error) {
        setStatus('error', `Error validando ruta: ${error.message}`);
        return false;
      } finally {
        setLoading(false);
      }
    }

    async function guardarRuta() {
      const ruta = rutaInput.value.trim();
      if (!ruta) {
        setStatus('warn', 'Ingresa una ruta antes de guardar.');
        return;
      }

      setLoading(true);
      setStatus('warn', 'Guardando configuracion...');
      try {
        const res = await window.uploadsConfig.save(ruta);
        if (!res.ok) {
          setStatus('error', `No se pudo guardar: ${res.message || 'Error desconocido.'}`);
          return;
        }

        rutaInput.value = res.normalizedPath || ruta;
        setStatus(
          'ok',
          res.restartScheduled
            ? 'Ruta guardada. Reinicio en curso...'
            : 'Ruta guardada. Reinicia la app cuando quieras aplicar cambios.'
        );
      } catch (error) {
        setStatus('error', `Error guardando ruta: ${error.message}`);
      } finally {
        setLoading(false);
      }
    }

    btnValidar.addEventListener('click', validarRuta);
    btnGuardar.addEventListener('click', guardarRuta);
    btnCancelar.addEventListener('click', () => window.close());

    rutaInput.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        event.preventDefault();
        validarRuta();
      }
    });

    window.addEventListener('DOMContentLoaded', cargarDatos);
  </script>
</body>
</html>
